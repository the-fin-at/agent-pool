[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-pool"
version = "0.2.0"
description = "Durable local task broker for native Codex and Claude Code profiles"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-pool = "agent_pool.cli:main"

[tool.setuptools.packages.find]
include = ["agent_pool*"]
