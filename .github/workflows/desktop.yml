name: desktop-build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Fleet-${{ runner.os }}
          path: |
            dist/Agent-Fleet-*.zip
            dist/Agent Fleet.pyzw
