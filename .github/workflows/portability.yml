name: Source portability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_portability tests.test_packaging_reference -v
      - run: python scripts/check_portability.py --report test-results/portability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-portability-inventory
          path: test-results/portability.json
